<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cynthia 的个人主页</title>
    <!-- 使用 Font Awesome 图标库 (免费) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
        }
        .card {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }
        .title {
            font-size: 16px;
            color: #64748b;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        .bio {
            font-size: 15px;
            line-height: 1.6;
            color: #334155;
            margin-bottom: 30px;
            padding: 0 10px;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }
        .social-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #f1f5f9;
            color: #1e293b;
            font-size: 22px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .social-links a:hover {
            background: #1e293b;
            color: #ffffff;
            transform: scale(1.08);
        }
        .footer-note {
            margin-top: 30px;
            font-size: 13px;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }
        /* 如果暂时没有头像，可以用首字母代替 */
        .avatar-placeholder {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #2d3b4f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            font-weight: 600;
            margin: 0 auto 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 头像：如果你有图片，把下面的 <div> 换成 <img> 并删掉 placeholder -->
        <div class="avatar-placeholder">C</div>
        <!-- 如果使用图片，请使用下面这行（注释掉上面那行） -->
        <!-- <img class="avatar" src="你的头像图片链接.jpg" alt="头像" /> -->

        <h1>Cynthia</h1>
        <div class="title">✨ 前端开发 & 创意设计</div>
        <div class="bio">
            你好！我是 Cynthia，热爱构建优雅的数字体验。<br />
            这个新主页是我用 GitHub Pages 搭建的 ✨
        </div>

        <div class="social-links">
            <!-- 替换 # 为你的真实链接 -->
            <a href="#" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
            <a href="#" target="_blank" aria-label="邮箱"><i class="fas fa-envelope"></i></a>
            <a href="#" target="_blank" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
            <a href="#" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
        </div>

        <div class="footer-note">
            🌱 持续迭代中 · 欢迎交流
        </div>
    </div>
</body>
</html>
